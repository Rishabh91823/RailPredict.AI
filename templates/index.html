<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RailPredict AI - Indian Railways PNR Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="/manifest.json">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 via-indigo-950 to-slate-900 min-h-screen text-slate-100 flex flex-col justify-between">

    <header class="w-full max-w-6xl mx-auto px-6 py-6 flex justify-between items-center border-b border-slate-800/80">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-indigo-500 rounded-xl flex items-center justify-center font-black text-xl text-white shadow-lg shadow-indigo-500/30">🚆</div>
            <span class="text-xl font-bold tracking-tight text-white">RailPredict <span class="text-indigo-400">AI</span></span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto w-full px-6 py-12 flex-grow flex items-center">
        <div class="grid grid-cols-1 md:grid-cols-12 gap-8 w-full">
            
            <div class="md:col-span-7 glass rounded-3xl p-8 text-slate-800 shadow-2xl relative">
                <div class="mb-6">
                    <h1 class="text-2xl font-extrabold text-slate-900">Predict Ticket Status</h1>
                    <p class="text-sm text-slate-500 mt-1">Enter your initial waitlist details to estimate confirmation probability.</p>
                </div>

                <form id="predictionForm" class="space-y-5">
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div class="relative">
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">From Station</label>
                            <input type="text" id="source_station_display" autocomplete="off" placeholder="Type station (e.g. New Delhi)" required 
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-900 font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                            <input type="hidden" id="source_station" required>
                            <ul id="source_suggestions" class="absolute z-50 w-full bg-white border border-slate-200 rounded-xl mt-1 hidden max-h-56 overflow-y-auto shadow-2xl custom-scrollbar"></ul>
                        </div>
                        
                        <div class="relative">
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">To Station</label>
                            <input type="text" id="dest_station_display" autocomplete="off" placeholder="Type station (e.g. Patna)" required 
                                class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-900 font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                            <input type="hidden" id="destination_station" required>
                            <ul id="dest_suggestions" class="absolute z-50 w-full bg-white border border-slate-200 rounded-xl mt-1 hidden max-h-56 overflow-y-auto shadow-2xl custom-scrollbar"></ul>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Journey Date (Max 60 Days)</label>
                            <!-- Date bounds restricted to Today and 60 days out -->
                            <input type="date" id="journey_date" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-900 font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Waitlist Number (WL)</label>
                            <input type="number" id="waitlist_number" min="1" max="1000" placeholder="e.g. 35" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-900 font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Travel Class</label>
                            <select id="coach_type" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-900 font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                                <option value="0">Sleeper (SL)</option>
                                <option value="1" selected>3AC (3A)</option>
                                <option value="2">2AC (2A)</option>
                                <option value="3">1AC (1A)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Quota</label>
                            <select id="quota" class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 text-slate-900 font-semibold focus:outline-none focus:ring-2 focus:ring-indigo-500 transition">
                                <option value="0">General (GN)</option>
                                <option value="1">Tatkal (TQ)</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="w-full mt-2 bg-indigo-600 hover:bg-indigo-700 active:scale-[0.99] text-white font-bold py-4 rounded-xl shadow-xl shadow-indigo-600/30 transition duration-200">
                        Calculate Confirmation Chance
                    </button>
                </form>
            </div>

            <!-- Right Results Display Column -->
            <div class="md:col-span-5 flex flex-col justify-center">
                <div id="resultsCard" class="bg-slate-800/60 border border-slate-700/60 rounded-3xl p-8 backdrop-blur-md shadow-2xl flex flex-col justify-center min-h-[360px] text-center">
                    
                    <div id="placeholderState">
                        <div class="w-16 h-16 bg-slate-700/50 rounded-2xl flex items-center justify-center mx-auto mb-4 text-3xl">📊</div>
                        <h3 class="text-lg font-bold text-slate-200">Awaiting Query</h3>
                        <p class="text-xs text-slate-400 mt-2 max-w-xs mx-auto">Fill out the form and submit to run your parameters through the AI engine.</p>
                    </div>

                    <div id="outputState" class="hidden space-y-6">
                        <span id="statusBadge" class="inline-block text-xs font-extrabold px-4 py-1.5 rounded-full border"></span>

                        <div>
                            <span class="text-xs font-bold uppercase tracking-widest text-slate-400">Confirmation Probability</span>
                            <div class="text-5xl font-black text-white mt-1" id="probabilityText">0%</div>
                        </div>

                        <div class="w-full bg-slate-700 rounded-full h-3 overflow-hidden p-0.5">
                            <div id="progressBar" class="h-full rounded-full transition-all duration-700 ease-out w-0"></div>
                        </div>
                        <p class="text-xs text-slate-400 leading-relaxed" id="predictionDetails"></p>
                    </div>

                </div>
            </div>

        </div>
    </main>

    <!-- Frontend Script -->
    <script>
        // Automatically enforce 60-day booking window constraints on date picker
        document.addEventListener('DOMContentLoaded', () => {
            const today = new Date();
            const yyyy = today.getFullYear();
            const mm = String(today.getMonth() + 1).padStart(2, '0');
            const dd = String(today.getDate()).padStart(2, '0');
            const minDate = `${yyyy}-${mm}-${dd}`;

            // Calculate date 60 days from today
            const maxDateObj = new Date();
            maxDateObj.setDate(today.getDate() + 60);
            const max_yyyy = maxDateObj.getFullYear();
            const max_mm = String(maxDateObj.getMonth() + 1).padStart(2, '0');
            const max_dd = String(maxDateObj.getDate()).padStart(2, '0');
            const maxDate = `${max_yyyy}-${max_mm}-${max_dd}`;

            const dateInput = document.getElementById('journey_date');
            dateInput.min = minDate;
            dateInput.max = maxDate;
        });

        let stationsData = [
            {name: "New Delhi", code: "NDLS"}, {name: "Patna Junction", code: "PNBE"},
            {name: "Mumbai CSMT", code: "CSMT"}, {name: "Howrah Junction", code: "HWH"},
            {name: "Kanpur Central", code: "CNB"}, {name: "Ghaziabad", code: "GZB"},
            {name: "Lucknow Charbagh", code: "LKO"}, {name: "Varanasi Junction", code: "BSB"},
            {name: "Gorakhpur Junction", code: "GKP"}, {name: "Ahmedabad Junction", code: "ADI"},
            {name: "Bangalore City", code: "SBC"}, {name: "Chennai Central", code: "MAS"},
            {name: "Hyderabad Decan", code: "HYB"}, {name: "Anand Vihar Terminal", code: "ANVT"},
            {name: "Hazrat Nizamuddin", code: "NZM"}, {name: "Old Delhi", code: "DLI"},
            {name: "Mumbai Central", code: "BCT"}, {name: "Pune Junction", code: "PUNE"},
            {name: "Jaipur Junction", code: "JP"}, {name: "Prayagraj Junction (Allahabad)", code: "PRYJ"},
            {name: "Allahabad Junction", code: "PRYJ"}, {name: "Danapur", code: "DNR"},
            {name: "Barauni Junction", code: "BJU"}, {name: "Prayagraj Rambag", code: "PRRB"}
        ];

        fetch('/stations.json')
            .then(res => res.json())
            .then(data => {
                if (Array.isArray(data) && data.length > 0) {
                    stationsData = stationsData.concat(data);
                }
            })
            .catch(err => console.log("Using built-in station list."));

        function setupAutocomplete(displayId, hiddenId, suggestionsId) {
            const displayInput = document.getElementById(displayId);
            const hiddenInput = document.getElementById(hiddenId);
            const suggestionsBox = document.getElementById(suggestionsId);

            displayInput.addEventListener('input', function() {
                const query = this.value.toLowerCase().trim();
                suggestionsBox.innerHTML = '';
                hiddenInput.value = ''; 

                if (query.length < 2) {
                    suggestionsBox.classList.add('hidden');
                    return;
                }

                const matches = stationsData.filter(stn => {
                    const name = (stn.name || stn.stationName || '').toLowerCase();
                    const code = (stn.code || stn.stationCode || '').toLowerCase();
                    return name.includes(query) || code.includes(query);
                }).slice(0, 30); 

                if (matches.length > 0) {
                    suggestionsBox.classList.remove('hidden');
                    
                    matches.forEach(match => {
                        const li = document.createElement('li');
                        li.className = 'px-4 py-3 hover:bg-indigo-50 cursor-pointer text-slate-700 text-sm border-b border-slate-100 font-medium transition';
                        
                        const stationName = match.name || match.stationName;
                        const stationCode = match.code || match.stationCode;
                        
                        li.textContent = `${stationName} (${stationCode})`;
                        
                        li.addEventListener('click', () => {
                            displayInput.value = `${stationName} (${stationCode})`;
                            hiddenInput.value = stationCode; 
                            suggestionsBox.classList.add('hidden');
                        });
                        
                        suggestionsBox.appendChild(li);
                    });
                } else {
                    suggestionsBox.classList.add('hidden');
                }
            });

            document.addEventListener('click', (e) => {
                if (e.target !== displayInput && e.target !== suggestionsBox) {
                    suggestionsBox.classList.add('hidden');
                }
            });
        }

        setupAutocomplete('source_station_display', 'source_station', 'source_suggestions');
        setupAutocomplete('dest_station_display', 'destination_station', 'dest_suggestions');

        document.getElementById('predictionForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const sourceCode = document.getElementById('source_station').value;
            const destCode = document.getElementById('destination_station').value;

            if (!sourceCode || !destCode) {
                alert("Please select your stations from the dropdown suggestions list.");
                return;
            }

            btn.disabled = true;
            btn.innerText = "Analyzing Waitlist Dynamics...";

            const payload = {
                source_station: sourceCode, 
                destination_station: destCode,
                journey_date: document.getElementById('journey_date').value,
                waitlist_number: parseInt(document.getElementById('waitlist_number').value),
                coach_type: parseInt(document.getElementById('coach_type').value),
                quota: parseInt(document.getElementById('quota').value)
            };

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                if(data.success) {
                    document.getElementById('placeholderState').classList.add('hidden');
                    document.getElementById('outputState').classList.remove('hidden');

                    const prob = data.probability;
                    document.getElementById('probabilityText').innerText = prob + '%';

                    const bar = document.getElementById('progressBar');
                    const badge = document.getElementById('statusBadge');
                    const details = document.getElementById('predictionDetails');

                    bar.style.width = prob + '%';

                    if (prob >= 60) {
                        bar.className = "h-full rounded-full transition-all duration-700 ease-out bg-emerald-500 shadow-lg shadow-emerald-500/50";
                        badge.className = "inline-block text-xs font-extrabold px-4 py-1.5 rounded-full border border-emerald-500/30 bg-emerald-500/10 text-emerald-400";
                        details.innerText = "High confirmation probability based on waitlist depth and historical clearance trends.";
                    } else if (prob >= 35) {
                        bar.className = "h-full rounded-full transition-all duration-700 ease-out bg-amber-500 shadow-lg shadow-amber-500/50";
                        badge.className = "inline-block text-xs font-extrabold px-4 py-1.5 rounded-full border border-amber-500/30 bg-amber-500/10 text-amber-400";
                        details.innerText = "Moderate chance. Confirmation will heavily depend on final chart preparation.";
                    } else {
                        bar.className = "h-full rounded-full transition-all duration-700 ease-out bg-rose-500 shadow-lg shadow-rose-500/50";
                        badge.className = "inline-block text-xs font-extrabold px-4 py-1.5 rounded-full border border-rose-500/30 bg-rose-500/10 text-rose-400";
                        details.innerText = "High waitlist number combined with short notice timeline indicates low confirmation probability.";
                    }

                    badge.innerText = data.status;
                } else {
                    alert("Backend Error: " + data.error);
                }
            } catch (err) {
                alert("An error occurred during prediction: " + err);
            } finally {
                btn.disabled = false;
                btn.innerText = "Calculate Confirmation Chance";
            }
        });
    </script>
</body>
</html>
